<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基準法のPre-Opinion by帚庵</title>
<style>
  :root {
    --felt-1: #1e4d38;
    --felt-2: #0a2418;
    --rail: #143026;
    --card-face: #f6f4ee;
    --ink: #1c1c1a;
    --ink-soft: #6b6b64;
    --ink-faint: #9a9a92;
    --gold: #b8ac8e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse at center, var(--felt-1) 0%, var(--felt-2) 75%);
    color: #eae7dd;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    line-height: 1.7;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 56px 24px 28px;
  }

  header h1 {
    font-size: 45px;
    font-weight: 500;
    margin: 0;
    letter-spacing: 0.04em;
    color: #f2f0e8;
  }

  header .by {
    font-size: 14.4px;
    color: var(--gold);
    margin-top: 8px;
    letter-spacing: 0.08em;
  }

  header .subtitle {
    font-size: 16.2px;
    color: #b9b6ac;
    margin-top: 16px;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  .felt-panel {
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.15));
    border: 1px solid var(--rail);
    border-radius: 18px;
    padding: 40px 20px;
    box-shadow:
      inset 0 0 60px rgba(0,0,0,0.4),
      0 0 0 6px #111113,
      0 0 0 9px #6b1f24;
    margin: 0 6px;
  }

  .hand-label {
    text-align: center;
    font-size: 13.2px;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 26px;
  }

  /* ---- 7並べ風テーブル ---- */
  .table {
    max-width: 960px;
    margin: 0 auto;
  }

  .suit-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }
  .suit-row:last-child { margin-bottom: 0; }

  .row-cards {
    display: flex;
    justify-content: center;
  }

  .deal {
    opacity: 0;
    animation: dealIn 0.55s cubic-bezier(.2,.75,.25,1) forwards;
    animation-delay: var(--delay);
    margin-left: -26px;
  }
  .deal:first-child { margin-left: 0; }

  /* 横（左）からスライドさせて配る */
  @keyframes dealIn {
    0%   { transform: translateX(-560px) translateY(18px) rotate(-16deg) scale(0.75); opacity: 0; }
    60%  { opacity: 1; }
    100% { transform: translateX(0) translateY(0) rotate(0deg) scale(1); opacity: 1; }
  }

  .card {
    background: var(--card-face);
    border-radius: 10px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.45);
    color: var(--ink);
    text-decoration: none;
    display: block;
    position: relative;
    padding: 8px 10px;
    border: 1px solid #d8d4c4;
    width: 128px;
    height: 182px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover {
    transform: translateY(-14px);
    box-shadow: 0 18px 28px rgba(0,0,0,0.55);
    z-index: 50;
  }
  .deal:hover { z-index: 50; position: relative; }

  .card .corner {
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 12.6px;
    line-height: 1.1;
    color: var(--ink);
  }
  .corner .suit { display: block; font-size: 13.8px; margin-top: 1px; }
  .corner.br { position: absolute; right: 8px; bottom: 6px; transform: rotate(180deg); }
  .corner.red { color: #8a1f1f; }

  .card .title {
    font-size: 13.2px;
    font-weight: 500;
    margin: 26px 2px 4px;
    text-align: center;
  }

  .card .desc {
    font-size: 11.4px;
    color: var(--ink-soft);
    text-align: center;
    margin: 0 2px;
    line-height: 1.45;
  }

  .card .tag {
    position: absolute;
    left: 8px;
    bottom: 6px;
    font-size: 10.2px;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
  }

  .card.soon {
    background: repeating-linear-gradient(135deg, #2b2b28 0 6px, #232320 6px 12px);
    border: 1px solid #3a3936;
    border-top: 3px solid #6b1f24;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .card.soon:hover { transform: translateY(-14px); }
  .card.soon .mark { font-size: 24px; color: var(--gold); opacity: 0.55; }
  .card.soon .soon-title { font-size: 12px; color: #eae7dd; margin-top: 8px; padding: 0 8px; }
  .card.soon .soon-tag { font-size: 10.2px; color: #b9b6ac; margin-top: 4px; }

  .disclaimer {
    max-width: 480px;
    margin: 40px auto 0;
    text-align: left;
    border-top: 1px solid #33362f;
    padding-top: 14px;
  }
  .disclaimer-title {
    font-size: 13.2px;
    font-weight: 500;
    color: #c9c4b4;
    margin-bottom: 6px;
    text-align: center;
  }
  .disclaimer ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13.2px;
    color: #a9a69c;
  }
  .disclaimer li {
    margin-bottom: 4px;
  }

  footer {
    text-align: center;
    padding: 24px 24px 60px;
    font-size: 13.2px;
    color: #8f8c82;
  }

  @media (max-width: 720px) {
    .row-cards { flex-wrap: wrap; justify-content: center; gap: 12px; }
    .deal { margin-left: 0; }
    @keyframes dealIn {
      0%   { transform: translateX(-260px) rotate(-12deg) scale(0.8); opacity: 0; }
      60%  { opacity: 1; }
      100% { transform: translateX(0) rotate(0deg) scale(1); opacity: 1; }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .deal { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>基準法のPre-Opinion</h1>
  <div class="by">by帚庵</div>

  <div class="disclaimer">
    <div class="disclaimer-title">免責事項</div>
    <ul>
      <li>本ツールは検討の参考用です。計算結果の正確性は保証しません。</li>
      <li>確認申請等への使用にあたっては、利用者自身の責任で告示等の根拠に基づき検証を行ってください。</li>
      <li>本ツールの使用により生じたいかなる損害についても、作成者は責任を負いません。</li>
    </ul>
  </div>
</header>

<main>

  <div class="felt-panel">
    <div class="hand-label">Table</div>
    <div class="table" id="table"></div>
  </div>

</main>

<footer>© 帚庵</footer>

<script>
  var CARDS = [
    {num:'01', suit:'♠', title:'法文墨塗り', desc:'法文を少しだけ読みやすく(告示向け)', tag:'条文読解', href:'https://ho-ki-an.github.io/legal-text-blackout/'},
    {num:'02', suit:'♠', title:'法文滑滑', desc:'デジタル版「指の栩」', tag:'条文読解', href:'https://ho-ki-an.github.io/jyoubun_sulusulu/'},
    {num:'03', suit:'♣', title:'現調表メニュー', desc:'敷地調査、現調表作成の手伝い', tag:'調査', href:'https://ho-ki-an.github.io/building-regulation-search/'},
    {num:'04', suit:'♥', title:'地盤面maker', desc:'シンプルな地盤面算定ツール', tag:'集団規定', href:'https://ho-ki-an.github.io/jiban-maker/'},
    {num:'05', suit:'♥', title:'道路斜線検討ツール', desc:'視覚的に検討(高低差緩和対応)', tag:'集団規定', href:'https://ho-ki-an.github.io/road-setback/'},
    {num:'06', suit:'♦', title:'2直checker', desc:'階段は 1or2？', tag:'単体規定', href:'https://ho-ki-an.github.io/2c-kaidan/'},
    {num:'07', suit:'♦', title:'耐火種別＋面積区画', desc:'区画開口部・遮煙を一気に', tag:'単体規定', href:'https://ho-ki-an.github.io/b-kukaku/'},
    {num:'08', suit:'♦', title:'延焼ライン', desc:'角度あり境界の検討、高さ緩和も', tag:'単体規定', href:'https://ho-ki-an.github.io/ensho_line/'},
    {num:'09', suit:'♠', title:'計画変更or軽微', desc:'判断の一助に', tag:'手続き', href:'https://ho-ki-an.github.io/kei-hen/'},
    {num:'10', suit:'♣', title:'区画避難', desc:'避難安全検証法の区画避難', tag:'高度な検討', href:'https://ho-ki-an.github.io/kukaku_hinan_b1/'},
    {num:'11', suit:'♠', title:'省エネ適判の要不要判定', desc:'いる・いらない？', tag:'手続き', href:'https://ho-ki-an.github.io/shone_hantei/'},
    {num:'12', suit:'♦', title:'歩行距離checker', desc:'最長歩行距離を確認', tag:'単体規定', href:'https://ho-ki-an.github.io/hokou_kyori/'},
    {num:'13', suit:'♠', title:'省エネ　軽微のルート判定', desc:'A/B/C ?', tag:'手続き', href:'https://ho-ki-an.github.io/shoene_route/'},
    {num:'14', suit:'♠', title:'用途変更申請の要不要判定', desc:'勘違い多数', tag:'手続き', href:'https://ho-ki-an.github.io/youto_henkou/'},
    {num:'15', suit:'♣', title:'階避難', desc:'避難安全検証法の階避難', tag:'高度な検討', href:'https://ho-ki-an.github.io/kai_hinan_b1/'},
    {num:'16', suit:'♦', title:'単体規定ch', desc:'かかる条文を洗い出し(Excel出力可)', tag:'単体規定', href:'https://ho-ki-an.github.io/tantai/'},
    {num:'17', suit:'♥', title:'集団規定ch', desc:'かかる条文を洗い出し(一次判定)', tag:'集団規定', href:'https://ho-ki-an.github.io/shudan2/'},
    {num:'18', suit:'♣', title:'関係規定ch', desc:'令9条1〜16号＋みなし規定3法を洗い出し', tag:'関係規定', href:'https://ho-ki-an.github.io/kankei/'},
    {soon:true, title:'確認申請はFRIへ', tag:'広告'},
    {soon:true, title:'一級建築士は日建学園', tag:'広告'},
    {soon:true, title:'省エネ適判はBB', tag:'広告'},
    {soon:true, title:'スッキリ爽快！朝日SAUNA', tag:'広告'},
    {soon:true, title:'広告募集中', tag:'広告'}
  ];

  /* 段ごとの配置（カード番号で指定） */
  var ROWS_DEF = [
    ['03', '02', '01'],                    /* 1段目：現調表メニュー・法文滑滑・法文墨塗り */
    ['17', '16', '18'],                    /* 2段目：集団規定ch・単体規定ch・関係規定ch */
    ['04', '05', '07', '08'],              /* 3段目：地盤面maker・道路斜線・耐火種別＋面積区画・延焼ライン */
    ['12', '06', '10', '15'],              /* 4段目：歩行距離checker・2直checker・区画避難・階避難 */
    ['09', '11', '13', '14']               /* 5段目：手続き系 */
  ];                                       /* 6段目：soonカード（リンクなし） */

  function cardHTML(item, delay) {
    var wrapStyle = '--delay:' + delay.toFixed(2) + 's;';
    if (item.soon) {
      return '<div class="deal" style="' + wrapStyle + '">' +
        '<div class="card soon">' +
        '<span class="mark">?</span>' +
        '<div class="soon-title">' + item.title + '</div>' +
        '<div class="soon-tag">' + item.tag + '</div>' +
        '</div></div>';
    }
    var isRed = (item.suit === '♥' || item.suit === '♦');
    var cornerClass = 'corner' + (isRed ? ' red' : '');
    var cornerBrClass = 'corner br' + (isRed ? ' red' : '');
    return '<div class="deal" style="' + wrapStyle + '">' +
      '<a class="card" href="' + item.href + '" target="_blank" rel="noopener">' +
      '<div class="' + cornerClass + '">' + item.num + '<span class="suit">' + item.suit + '</span></div>' +
      '<div class="title">' + item.title + '</div>' +
      '<div class="desc">' + item.desc + '</div>' +
      '<div class="' + cornerBrClass + '">' + item.num + '<span class="suit">' + item.suit + '</span></div>' +
      '<div class="tag">' + item.tag + '</div>' +
      '</a></div>';
  }

  function findCard(num) {
    for (var i = 0; i < CARDS.length; i++) {
      if (CARDS[i].num === num) return CARDS[i];
    }
    return null;
  }

  function deal() {
    var rows = [];
    for (var r = 0; r < ROWS_DEF.length; r++) {
      var cards = [];
      for (var c = 0; c < ROWS_DEF[r].length; c++) {
        var card = findCard(ROWS_DEF[r][c]);
        if (card) cards.push(card);
      }
      rows.push({ cards: cards });
    }
    rows.push({ cards: CARDS.filter(function (c) { return c.soon; }) });

    /* 配る順：各段に1枚ずつ順番に（ディーラーが配るイメージ） */
    var delays = [];
    var t = 0;
    var maxLen = 0;
    for (var r1 = 0; r1 < rows.length; r1++) {
      delays.push([]);
      if (rows[r1].cards.length > maxLen) maxLen = rows[r1].cards.length;
    }
    for (var col = 0; col < maxLen; col++) {
      for (var r2 = 0; r2 < rows.length; r2++) {
        if (col < rows[r2].cards.length) {
          delays[r2][col] = 0.05 + t * 0.06;
          t++;
        }
      }
    }

    var html = '';
    for (var i = 0; i < rows.length; i++) {
      html += '<div class="suit-row"><div class="row-cards">';
      for (var j = 0; j < rows[i].cards.length; j++) {
        html += cardHTML(rows[i].cards[j], delays[i][j]);
      }
      html += '</div></div>';
    }
    document.getElementById('table').innerHTML = html;
  }

  deal();
</script>

</body>
</html>
